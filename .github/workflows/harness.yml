name: Harness CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  harness:
    name: Harness CI Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for git diff
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run harness CI
        run: npm run harness:ci
