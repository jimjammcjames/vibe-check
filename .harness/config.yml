# Harness Configuration

agents:
  provider: gemini
  fallback_provider: codex
  gemini_home: ".harness/.gemini-home"
  copilot_reasoning: high
  copilot_config_dir: ".harness/.copilot"

# Anti-Gamification Review Layer
reviewers:
  # Deterministic: tests must fail on base commit when learned entry present
  base_tripwire:
    enabled: true
    base_ref: "origin/main"
    require_fail_on_base: true
    allow_weak_pass: true
    exempt_tag: "#basefail-exempt"
    run_tests_cmd: "npm test"
    list_tests_cmd: "find harness-tests/tests -maxdepth 1 -name '*.test.mjs' -print"
    list_tests_pattern: "(.+\\.test\\.mjs)"
    validate_test_discovery: true

  # Pluggable reviewer (adapter-based)
  code_reviewer:
    enabled: true
    adapter: "auto"
    fail_threshold: "high"
    base_ref: "origin/main"

stages:
  iterate:
    - command: "npx prettier --write"
      files: changed
    - command: "npx eslint --fix"
      files: changed

  post:
    # Portable installs must replace this with the repo's test command (usually npm test).
    - command: "npm run test:local"
    - command: "node .harness/framework/scripts/test-lint.mjs"
    - command: "node .harness/framework/scripts/policy-audit.mjs"

  ci:
    - command: "npx prettier --check ."
    - command: "npx eslint ."
    - command: "npx tsc --noEmit"
    - command: "npm test"
    - command: "node .harness/framework/scripts/test-lint.mjs"
    - command: "node .harness/framework/scripts/policy-audit.mjs"
    - command: "node .harness/framework/scripts/harness-guardian.mjs"
    - command: "node .harness/framework/scripts/undocumented-detector.mjs"
    - command: "node .harness/framework/scripts/agent-memory-coherence.mjs"
    - command: "node .harness/framework/scripts/base-tripwire.mjs"
    - command: "node .harness/framework/scripts/agent-code-review.mjs"

globs:
  # Files that count as "real code" - changes require memory entry
  realCode:
    - "src/**/*.ts"
    - "src/**/*.tsx"
    - "src/**/*.js"
    - "src/**/*.jsx"
    - ".harness/framework/scripts/**/*.mjs"
    - ".harness/framework/cli/**/*.mjs"
    - ".harness/framework/lib/**/*.mjs"
    - ".harness/framework/providers/**/*.mjs"
    - ".harness/framework/templates/**/*.md"
    - ".harness/Harness.md"
    - ".harness/config.yml"
    - "AGENTS.md"
    # Remove these lines when porting without harness-tests/ in the target repo.
    - "harness-tests/simulation/**/*.sh"
    - "harness-tests/simulation/**/*.mjs"
    - "harness-tests/tests/**/*.mjs"

  # Files that are exempt from memory requirement
  exempt:
    - "*.json"
    - ".github/**"
    - ".harness/setup/**"
    - "README.md"
    - "workflows/**/*.md"
    - ".gitignore"
    - ".eslintrc*"
    - ".prettierrc*"
    - "tsconfig.json"

  # Test files - required when adding learned entries
  tests:
    - "**/*.test.ts"
    - "**/*.test.tsx"
    - "**/*.test.js"
    - "**/*.test.mjs"
    - "**/*.spec.ts"
    - "**/*.spec.tsx"
    - "**/*.spec.js"
    - "**/__tests__/**"
    - "**/test/**"
    - "**/tests/**"

  # Memory entry locations
  history: ".harness/context/history/**/*.md"

  # Session artifact locations
  sessions: ".harness/context/sessions/**/*.md"

  # Harness core enforcement surfaces (context artifacts excluded)
  harnessCore:
    - ".harness/framework/**"
    - ".harness/config.yml"
    - ".harness/Harness.md"
    - "AGENTS.md"
    - "package.json"
    - "workflows/skills/**"

  # Test-side files (applied to base commit in tripwire)
  testSide:
    - "**/*.test.ts"
    - "**/*.test.tsx"
    - "**/*.test.js"
    - "**/*.test.mjs"
    - "**/*.spec.ts"
    - "**/*.spec.tsx"
    - "**/*.spec.js"
    - "**/__tests__/**"
    - "**/__mocks__/**"
    - "**/test-utils/**"
    - "**/fixtures/**"
