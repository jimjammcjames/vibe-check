name: Harness CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  harness:
    name: Harness CI Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for git diff

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run harness CI
        env:
          HARNESS_ALLOW_MISSING_AGENT_PROVIDER: "1"
        run: npm run harness:ci

      - name: Upload harness diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-diagnostics
          path: .harness/diagnostics/latest
          if-no-files-found: ignore
